<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCC Manager</title>

    <script type="module">
        import * as monaco from "https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/+esm";
        window.monaco = monaco;
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/nodes.css">
    <link rel="stylesheet" href="css/monaco.css">

    <script src="js/theme.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/nodes.js"></script>
    <script src="js/monaco.js"></script>
    <script src="js/main.js"></script>
    <script src="js/editor.js"></script>
</head>
<body class="editor-page">
    <header class="toolbar">
        <div class="editor-toolbar-left hidden" id="editor-status-bar">
            <button type="button" class="editor-sidebar-toggle" id="editor-sidebar-toggle" aria-label="Toggle sidebar" title="Toggle sidebar">
                <span class="editor-sidebar-icon editor-sidebar-icon-expand" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M300-640v320l160-160-160-160ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm440-80h120v-560H640v560Zm-80 0v-560H200v560h360Zm80 0h120-120Z"/></svg>
                </span>
                <span class="editor-sidebar-icon editor-sidebar-icon-collapse" aria-hidden="true" hidden>
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M460-320v-320L300-480l160 160ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm440-80h120v-560H640v560Zm-80 0v-560H200v560h360Zm80 0h120-120Z"/></svg>
                </span>
            </button>
            <button type="button" class="editor-status-btn" id="editor-back">Back</button>
            <span class="editor-status-sep" aria-hidden="true">|</span>
            <span class="editor-status-label">Working with <span id="editor-filename"></span></span>
            <span class="editor-status-sep" aria-hidden="true">|</span>
            <button type="button" class="editor-status-btn" id="editor-download">Download</button>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="editor-view-toggle hidden" id="editor-view-toggle">
            <button type="button" class="editor-view-btn is-active" id="editor-view-gui" aria-pressed="true">GUI</button>
            <button type="button" class="editor-view-btn" id="editor-view-json" aria-pressed="false">JSON</button>
        </div>
        <div class="toolbar-spacer"></div>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
            <span class="theme-icon theme-icon-sun" aria-hidden="true">
                <svg focusable="false" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5M2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1m18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1M11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1m0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1M5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0z"/>
                </svg>
            </span>
            <span class="theme-icon theme-icon-moon" aria-hidden="true" hidden>
                <svg focusable="false" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1"/>
                </svg>
            </span>
        </button>
    </header>

    <main id="editor-main" class="editor-main hidden">
        <div id="editor-gui-panel" class="editor-panel editor-panel-gui">
            <aside id="editor-gui-sidebar" class="editor-gui-sidebar">
                <div class="editor-sidebar-view-toggle">
                    <button type="button" class="editor-sidebar-view-btn is-active" id="editor-sidebar-repo" aria-pressed="true">Repo</button>
                    <button type="button" class="editor-sidebar-view-btn" id="editor-sidebar-tree" aria-pressed="false">Tree</button>
                </div>
                <div id="editor-gui-sidebar-repo" class="editor-gui-sidebar-panel">...</div>
                <div id="editor-gui-sidebar-tree" class="editor-gui-sidebar-panel hidden">
                    <div id="editor-gui-sidebar-graph" class="editor-gui-sidebar-graph node-graph"></div>
                </div>
            </aside>
            <div class="editor-gui-main">
                <!-- Main GUI content area -->
            </div>
        </div>
        <div id="editor-json-panel" class="editor-panel editor-panel-json hidden"></div>
    </main>

    <div id="editor-error" class="editor-error hidden">
        <p class="editor-error-message" id="editor-error-message"></p>
        <a href="index.html" id="editor-error-try-again-link" class="editor-error-try-again">Try again</a>
    </div>

    <div id="localstorage-consent" class="localstorage-consent hidden" role="dialog" aria-label="Storage preference">
        <p class="localstorage-consent-text">Can this page use localStorage to save your preferences (e.g. theme)?</p>
        <div class="localstorage-consent-actions">
            <button type="button" class="localstorage-consent-btn" data-consent-accept>Accept</button>
            <button type="button" class="localstorage-consent-btn" data-consent-decline>Decline</button>
        </div>
    </div>
</body>
</html>
