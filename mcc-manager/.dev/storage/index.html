<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StorageHandler test</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel: #16213e;
            --accent: #0f3460;
            --text: #e8e8e8;
            --muted: #a0a0a0;
            --success: #4ecca3;
            --danger: #e94560;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 1.5rem;
            min-height: 100vh;
        }
        h1 { margin-top: 0; font-size: 1.5rem; }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.75rem;
            background: var(--panel);
            border-radius: 6px;
            margin-bottom: 1rem;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
        }
        .status-dot.persistent { background: var(--success); }
        .status-dot.session { background: #f39c12; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }
        section {
            background: var(--panel);
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid var(--accent);
        }
        section h2 {
            margin: 0 0 0.75rem;
            font-size: 0.95rem;
            color: var(--muted);
        }
        .row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .row:last-child { margin-bottom: 0; }
        input[type="text"], input[type="number"] {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid var(--accent);
            border-radius: 4px;
            background: var(--bg);
            color: var(--text);
        }
        button {
            padding: 0.5rem 0.75rem;
            border: none;
            border-radius: 4px;
            background: var(--accent);
            color: var(--text);
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover { filter: brightness(1.15); }
        button.danger { background: var(--danger); }
        button.primary { background: var(--success); color: var(--bg); }
        #log {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--bg);
            border: 1px solid var(--accent);
            border-radius: 8px;
            font-family: ui-monospace, monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 320px;
            overflow-y: auto;
        }
        #log .ts { color: var(--muted); }
        #log .ok { color: var(--success); }
        #log .err { color: var(--danger); }
    </style>
</head>
<body>
    <h1>StorageHandler test</h1>
    <div class="status" id="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Initializing…</span>
    </div>

    <div class="grid">
        <section>
            <h2>Persistence</h2>
            <div class="row">
                <button type="button" id="btnAllow">Allow persistence (IndexedDB)</button>
            </div>
            <div class="row">
                <button type="button" id="btnDisallow">Disallow (sessionStorage)</button>
            </div>
            <div class="row">
                <button type="button" id="btnInit">Init</button>
            </div>
            <div class="row">
                <button type="button" id="btnGetBackendName">Get backend name</button>
            </div>
        </section>

        <section>
            <h2>Set / Get</h2>
            <div class="row">
                <input type="text" id="setKey" placeholder="Key" />
                <input type="text" id="setVal" placeholder="Value" />
                <button type="button" id="btnSet">Set</button>
            </div>
            <div class="row">
                <input type="text" id="getKey" placeholder="Key" />
                <button type="button" id="btnGet">Get</button>
            </div>
            <div class="row">
                <input type="text" id="issetKey" placeholder="Key" />
                <button type="button" id="btnIsset">Isset</button>
            </div>
        </section>

        <section>
            <h2>Keys &amp; list</h2>
            <div class="row">
                <button type="button" id="btnKeys">List keys</button>
            </div>
            <div class="row">
                <button type="button" id="btnValues">Values</button>
            </div>
            <div class="row">
                <button type="button" id="btnGetAll">Get all</button>
            </div>
        </section>

        <section>
            <h2>Unset &amp; clear</h2>
            <div class="row">
                <input type="text" id="unsetKey" placeholder="Key" />
                <button type="button" id="btnUnset">Unset</button>
            </div>
            <div class="row">
                <button type="button" id="btnClear" class="danger">Clear all</button>
            </div>
        </section>

        <section>
            <h2>All backends</h2>
            <div class="row">
                <button type="button" id="btnGetAllBackends">Get all backends</button>
            </div>
            <div class="row">
                <button type="button" id="btnClearAllBackends" class="danger">Clear all backends</button>
            </div>
        </section>
    </div>

    <div id="log"></div>

    <script src="storage.js"></script>
    <script>
        (function () {
            const handler = window.StorageHandler;
            const logEl = document.getElementById("log");
            const statusEl = document.getElementById("statusText");
            const statusDot = document.getElementById("statusDot");

            function ts() {
                return new Date().toLocaleTimeString("sv-SE", { hour12: false });
            }

            function log(msg, type) {
                const line = document.createElement("div");
                line.className = type || "";
                line.innerHTML = "<span class=\"ts\">[" + ts() + "]</span> " + msg;
                logEl.appendChild(line);
                logEl.scrollTop = logEl.scrollHeight;
            }

            function updateStatus() {
                const name = handler.getBackendName();
                statusEl.textContent = "Persistence: " + (handler.persistenceAllowed ? "ON" : "OFF") + " → " + name;
                statusDot.className = "status-dot " + (handler.persistenceAllowed ? "persistent" : "session");
            }

            document.getElementById("btnAllow").onclick = async function () {
                try {
                    await handler.setPersistenceAllowed(true);
                    updateStatus();
                    log("setPersistenceAllowed(true) → backend: " + handler.getBackendName(), "ok");
                } catch (e) {
                    log("setPersistenceAllowed error: " + e.message, "err");
                }
            };

            document.getElementById("btnDisallow").onclick = async function () {
                try {
                    await handler.setPersistenceAllowed(false);
                    updateStatus();
                    log("setPersistenceAllowed(false) → backend: " + handler.getBackendName(), "ok");
                } catch (e) {
                    log("setPersistenceAllowed error: " + e.message, "err");
                }
            };

            document.getElementById("btnInit").onclick = async function () {
                try {
                    await handler.init();
                    updateStatus();
                    log("Initialized. Backend: " + handler.getBackendName(), "ok");
                } catch (e) {
                    log("Init error: " + e.message, "err");
                }
            };

            document.getElementById("btnGetBackendName").onclick = function () {
                const name = handler.getBackendName();
                log("getBackendName() => \"" + name + "\"", "ok");
            };

            document.getElementById("btnSet").onclick = async function () {
                const key = document.getElementById("setKey").value.trim();
                const val = document.getElementById("setVal").value;
                if (!key) {
                    log("Set: key is empty.", "err");
                    return;
                }
                try {
                    await handler.set(key, val);
                    log("Set \"" + key + "\" = \"" + val + "\"", "ok");
                } catch (e) {
                    log("Set error: " + e.message, "err");
                }
            };

            document.getElementById("btnGet").onclick = async function () {
                const key = document.getElementById("getKey").value.trim();
                if (!key) {
                    log("Get: key is empty.", "err");
                    return;
                }
                try {
                    const v = await handler.get(key);
                    log("Get \"" + key + "\" => " + JSON.stringify(v), "ok");
                } catch (e) {
                    log("Get error: " + e.message, "err");
                }
            };

            document.getElementById("btnIsset").onclick = async function () {
                const key = document.getElementById("issetKey").value.trim();
                if (!key) {
                    log("Isset: key is empty.", "err");
                    return;
                }
                try {
                    const ok = await handler.isset(key);
                    log("isset(\"" + key + "\") => " + ok, "ok");
                } catch (e) {
                    log("Isset error: " + e.message, "err");
                }
            };

            document.getElementById("btnKeys").onclick = async function () {
                try {
                    const keys = await handler.keys();
                    log("Keys: " + JSON.stringify(keys), "ok");
                } catch (e) {
                    log("Keys error: " + e.message, "err");
                }
            };

            document.getElementById("btnValues").onclick = async function () {
                try {
                    const values = await handler.values();
                    log("Values: " + JSON.stringify(values), "ok");
                } catch (e) {
                    log("Values error: " + e.message, "err");
                }
            };

            document.getElementById("btnGetAll").onclick = async function () {
                try {
                    const all = await handler.getAll();
                    log("GetAll: " + JSON.stringify(all), "ok");
                } catch (e) {
                    log("GetAll error: " + e.message, "err");
                }
            };

            document.getElementById("btnUnset").onclick = async function () {
                const key = document.getElementById("unsetKey").value.trim();
                if (!key) {
                    log("Unset: key is empty.", "err");
                    return;
                }
                try {
                    await handler.unset(key);
                    log("Unset \"" + key + "\"", "ok");
                } catch (e) {
                    log("Unset error: " + e.message, "err");
                }
            };

            document.getElementById("btnClear").onclick = async function () {
                if (!confirm("Clear all entries in current backend?")) return;
                try {
                    await handler.clearAll();
                    log("Cleared all.", "ok");
                } catch (e) {
                    log("Clear error: " + e.message, "err");
                }
            };

            document.getElementById("btnGetAllBackends").onclick = async function () {
                try {
                    const all = await handler.getAllBackends();
                    log("GetAllBackends: " + JSON.stringify(all), "ok");
                } catch (e) {
                    log("GetAllBackends error: " + e.message, "err");
                }
            };

            document.getElementById("btnClearAllBackends").onclick = async function () {
                if (!confirm("Clear IndexedDB, sessionStorage and localStorage?")) return;
                try {
                    await handler.clearAllBackends();
                    log("Cleared all backends.", "ok");
                } catch (e) {
                    log("ClearAllBackends error: " + e.message, "err");
                }
            };

            updateStatus();
            log("Ready. Set persistence, then Init. Use Set/Get/Keys/Unset/Clear to test.", "ok");
        })();
    </script>
</body>
</html>
