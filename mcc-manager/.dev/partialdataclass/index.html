<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="nodes.css">
    
    <script src="nodes.js"></script>
    <script src="main.js"></script>
    <script src="test.js"></script>
</head>
<body>
    <div id="graph"></div>

    <script>
        (async () => {
            const base = await fetch("./repo.json").then(r => r.json());

            // Check if keypath exists in obj (optionally relative to baseKeypath for partial subtrees)
            function pathExistsIn(obj, keypath, baseKeypath) {
                let path = keypath.split(".").filter(Boolean);
                if (baseKeypath) {
                    const baseParts = baseKeypath.split(".").filter(Boolean);
                    path = path.slice(baseParts.length);
                }
                let cur = obj;
                for (const k of path) {
                    if (cur == null || typeof cur !== "object") return false;
                    if (!(k in cur)) return false;
                    cur = cur[k];
                }
                return true;
            }

            function childKeypath(parentKeypath, key) {
                if (!parentKeypath || parentKeypath === ".") return key.startsWith("[") ? key : key;
                return key.startsWith("[") ? parentKeypath + key : parentKeypath + "." + key;
            }

            function findNodeInTree(root, keypath) {
                if (root.keypath === keypath) return root;
                if (!root.children) return null;
                for (const c of root.children) {
                    const found = findNodeInTree(c, keypath);
                    if (found) return found;
                }
                return null;
            }

            const rootNode = { name: "Data", keypath: ".", children: [] };
            const pendingRenames = new Map();

            async function refreshSubtreeAt(parentKeypath) {
                if (parentKeypath === "." || parentKeypath === "" || parentKeypath == null) {
                    rootNode.children = (await pd.keys(".")).map((k) => ({
                        name: k,
                        keypath: childKeypath(".", k),
                        children: []
                    }));
                    updateNodeGraph(".", [rootNode], container, makeClickHandler());
                    return;
                }

                const node = findNodeInTree(rootNode, parentKeypath);
                if (node) {
                    node.children = (await pd.keys(parentKeypath)).map((k) => ({
                        name: k,
                        keypath: childKeypath(parentKeypath, k),
                        children: []
                    }));
                    // Update only this subtree's root node in-place
                    updateNodeGraph(parentKeypath, [node], container, makeClickHandler());
                    return;
                }

                // Fallback: full refresh if we couldn't find the subtree node
                updateNodeGraph(".", [rootNode], container, makeClickHandler());
            }

            const pd = new PartialDataClass(base, [
                {
                    keypath: "sub1",
                    url: "./sub1.json",
                    onChange: async (kp, newData) => {
                        const mapped = pendingRenames.get(kp);
                        if (mapped) {
                            // Rename case: patch existing node instead of rebuilding it
                            pendingRenames.delete(kp);
                            const oldKp = kp;
                            const newKp = mapped;
                            const node = findNodeInTree(rootNode, oldKp);
                            const newNameFromKp =
                                (newKp === "." || newKp === "")
                                    ? "Data"
                                    : newKp.split(".").filter(Boolean).pop();
                            if (node) {
                                node.keypath = newKp;
                                node.name = newNameFromKp;
                            }
                            updateNode(oldKp, container, { name: newNameFromKp });
                            const el = container.querySelector(`.node[data-keypath="${oldKp}"]`);
                            if (el) {
                                el.setAttribute("data-keypath", newKp);
                            }
                            return;
                        }

                        const exists = pathExistsIn(newData, kp, "sub1");
                        console.log(kp, newData, exists);
                        const parts = kp.split(".").filter(Boolean);
                        const parentKeypath = parts.length <= 1 ? "." : parts.slice(0, -1).join(".");
                        await refreshSubtreeAt(parentKeypath);
                        if (exists) {
                            const name = parts.length ? parts[parts.length - 1] : "Data";
                            updateNode(kp, container, { name });
                        }
                    }
                },
                {
                    keypath: "sub2",
                    url: "./sub2.json",
                    onChange: async (kp, newData) => {
                        const mapped = pendingRenames.get(kp);
                        if (mapped) {
                            pendingRenames.delete(kp);
                            const oldKp = kp;
                            const newKp = mapped;
                            const node = findNodeInTree(rootNode, oldKp);
                            const newNameFromKp =
                                (newKp === "." || newKp === "")
                                    ? "Data"
                                    : newKp.split(".").filter(Boolean).pop();
                            if (node) {
                                node.keypath = newKp;
                                node.name = newNameFromKp;
                            }
                            updateNode(oldKp, container, { name: newNameFromKp });
                            const el = container.querySelector(`.node[data-keypath="${oldKp}"]`);
                            if (el) {
                                el.setAttribute("data-keypath", newKp);
                            }
                            return;
                        }

                        const exists = pathExistsIn(newData, kp, "sub2");
                        console.log(kp, newData, exists);
                        const parts = kp.split(".").filter(Boolean);
                        const parentKeypath = parts.length <= 1 ? "." : parts.slice(0, -1).join(".");
                        await refreshSubtreeAt(parentKeypath);
                        if (exists) {
                            const name = parts.length ? parts[parts.length - 1] : "Data";
                            updateNode(kp, container, { name });
                        }
                    }
                }
            ], async (kp, newData) => {
                const mapped = pendingRenames.get(kp);
                if (mapped) {
                    pendingRenames.delete(kp);
                    const oldKp = kp;
                    const newKp = mapped;
                    const node = findNodeInTree(rootNode, oldKp);
                    const newNameFromKp =
                        (newKp === "." || newKp === "")
                            ? "Data"
                            : newKp.split(".").filter(Boolean).pop();
                    if (node) {
                        node.keypath = newKp;
                        node.name = newNameFromKp;
                    }
                    updateNode(oldKp, container, { name: newNameFromKp });
                    const el = container.querySelector(`.node[data-keypath="${oldKp}"]`);
                    if (el) {
                        el.setAttribute("data-keypath", newKp);
                    }
                    return;
                }

                const exists = pathExistsIn(newData, kp);
                console.log(kp, newData, exists);
                const parts = kp.split(".").filter(Boolean);
                const parentKeypath = parts.length === 0 ? "." : (parts.length === 1 ? "." : parts.slice(0, -1).join("."));
                await refreshSubtreeAt(parentKeypath);
                if (exists) {
                    const name = parts.length ? parts[parts.length - 1] : "Data";
                    updateNode(kp, container, { name });
                }
            });

            window.pd = pd;

            const container = document.getElementById("graph");

            // Right-click handler: get keypath, show node name; on OK and newName !== name, rename in PartialDataClass
            container.addEventListener("contextmenu", async (event) => {
                const nodeEl = event.target.closest(".node");
                if (!nodeEl || !container.contains(nodeEl)) return;

                event.preventDefault();

                const keypath = getKeypathOfNode(event.target, container);
                if (keypath == null) return;

                // Name = key at this path (last segment of keypath, or "Data" for root)
                const name = (keypath === "." || keypath === "")
                    ? "Data"
                    : keypath.split(".").filter(Boolean).pop();

                const newName = window.prompt("Edit (node name):", name);
                if (newName == null) return; // cancelled
                if (newName.trim() === name) return; // unchanged

                // Only rename non-root keys (root has no key to rename)
                const parts = keypath.split(".").filter(Boolean);
                if (parts.length === 0) return;

                const parentKeypath = parts.length === 1 ? "." : parts.slice(0, -1).join(".");
                const newKeypath = childKeypath(parentKeypath, newName.trim());
                pendingRenames.set(keypath, newKeypath);

                await pd.rename(keypath, newName.trim());
            });

            async function expandNode(node, event) {
                if (node.children && node.children.length > 0) return;
                if (node.value !== undefined) return;
                event.preventDefault();
                event.stopPropagation();
                const value = await pd.get(node.keypath);
                if (value === null || typeof value !== "object") {
                    node.value = value;
                    node.children = [];
                    updateNodeGraph(".", [rootNode], container, makeClickHandler());
                    return;
                }
                const keys = await pd.keys(node.keypath);
                node.children = keys.map((k) => ({
                    name: k,
                    keypath: childKeypath(node.keypath, k),
                    children: []
                }));
                updateNodeGraph(".", [rootNode], container, makeClickHandler());
            }

            function makeClickHandler() {
                return (node, event) => {
                    if (node.children && node.children.length > 0) return;
                    if (node.value !== undefined) return;
                    expandNode(node, event);
                };
            }

            const topKeys = await pd.keys(".");
            rootNode.children = topKeys.map((k) => ({
                name: k,
                keypath: childKeypath(".", k),
                children: []
            }));

            updateNodeGraph(".", [rootNode], container, makeClickHandler());
        })().catch(err => {
            const pre = document.createElement("pre");
            pre.style.whiteSpace = "pre-wrap";
            pre.textContent = String(err && (err.stack || err.message || err));
            document.body.appendChild(pre);
            console.error(err);
        });
    </script>
</body>
</html>
