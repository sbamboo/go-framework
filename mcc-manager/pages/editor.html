<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/images/favicon_128.png">
    <title>MCC Manager - Editor</title>

    <script type="module">
        import * as monaco from "https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/+esm";
        window.monaco = monaco;
    </script>

    <link rel="stylesheet" href="../css/popups.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cookies.css">
    <link rel="stylesheet" href="../css/nodes.css">
    <link rel="stylesheet" href="../css/monaco.css">
    <link rel="stylesheet" href="../css/pages/editor.css">

    <script src="../js/popups.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/cookies.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/partialdc.js"></script>
    <script src="../js/nodes_renderonly.js"></script>
    <script src="../js/nodes.js"></script>
    <script src="../js/monaco.js"></script>
    <script src="../js/pages/editor.js"></script>
</head>
<body>
    <div id="overlay-container">
        <div id="popup-container">
            <div id="is-modified-warn" class="popup-modal" style="display: none;">
                <div class="popup-header">
                    <h2 class="popup-title">Unsaved changes</h2>
                </div>
                <div class="popup-body">
                    <p class="popup-text">
                        You have unsaved changes. Go back anyway?
                    </p>
                </div>
                <div class="popup-footer">
                    <button type="button" id="is-modified-confirm" class="start-primary">
                        Go back anyway
                    </button>
                    <button type="button" id="is-modified-cancel" class="start-secondary">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
        <div id="portal-container"></div>
    </div>

    <header class="page-header">
        <img src="../assets/images/favicon2_128.png" alt="MCC Manager" class="page-header-logo"/>

        <h1 class="page-header-title"></h1>

        <div class="header-vertical-separator"></div>

        <button type="button" class="editor-back-button" id="editor-go-back">
            Go back
        </button>

        <p id="editor-loaded-files-text"></p>

        <div class="editor-header-left">
            <p id="editor-ismodified-text"></p>
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" data-bind="true">
                <span class="theme-icon theme-icon-sun" aria-hidden="true" hidden>
                    <svg focusable="false" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5M2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1m18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1M11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1m0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1M5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0z"/>
                    </svg>
                </span>
                <span class="theme-icon theme-icon-moon" aria-hidden="true" hidden>
                    <svg focusable="false" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1"/>
                    </svg>
                </span>
            </button>
        </div>
    </header>

    <main id="editor-main">
        <div id="editor-no-repo" class="editor-no-repo-message" style="display: none;">
            No repository loaded, choose one on the <a id="editor-no-repo-link" href="../index.html">start page</a>.
        </div>
    </main>
</body>
</html>
