<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/images/favicon_128.png">
    <title>MCC Manager</title>

    <script type="module">
        import * as monaco from "https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/+esm";
        window.monaco = monaco;
    </script>

    <link rel="stylesheet" href="css/popups.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cookies.css">
    <link rel="stylesheet" href="css/nodes.css">
    <link rel="stylesheet" href="css/monaco.css">
    <link rel="stylesheet" href="css/pages/start.css">

    <script src="js/popups.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/nodes_renderonly.js"></script>
    <script src="js/nodes.js"></script>
    <script src="js/monaco.js"></script>
    <script src="js/pages/start.js"></script>
</head>
<body>
    <div id="overlay-container">
        <div id="popup-container">
            <div id="partials-modal" class="popup-modal" style="display: none;">
                <div class="popup-header">
                    <h2 class="popup-title">Repository has partials</h2>
                    <button id="settings-closer" class="popup-closer" type="button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <path d="M18 6l-12 12" /><path d="M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <div class="popup-body">
                    <p class="popup-text">
                        Verify where you want to fetch partials from:
                    </p>

                    <div class="partials-table-wrap">
                        <table class="partials-table">
                            <thead>
                                <tr>
                                    <th scope="col">Key path</th>
                                    <th scope="col">Source</th>
                                </tr>
                            </thead>
                            <tbody id="partials-table-body">
                                <!-- Filled dynamically based on loaded partials -->
                            </tbody>
                        </table>
                    </div>

                    <div id="partials-error" class="start-error" role="alert" aria-live="polite"></div>
                </div>

                <div class="popup-footer">
                    <button type="button" id="partials-ok" class="start-primary">
                        OK
                    </button>
                    <button type="button" id="partials-cancel" class="start-secondary">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
        
        <div id="portal-container"></div>
    </div>

    <header class="page-header">
        <img src="./assets/images/favicon2_128.png" alt="MCC Manager" class="page-header-logo"/>

        <h1 class="page-header-title">MCC Manager</h1>

        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" data-bind="true">
            <span class="theme-icon theme-icon-sun" aria-hidden="true" hidden>
                <svg focusable="false" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5M2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1m18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1M11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1m0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1M5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0z"/>
                </svg>
            </span>
            <span class="theme-icon theme-icon-moon" aria-hidden="true" hidden>
                <svg focusable="false" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1"/>
                </svg>
            </span>
        </button>
    </header>

    <main>
        <section class="start-cards" aria-label="Start actions">
            <div class="start-cards-row">
                <div class="start-card" role="region" aria-labelledby="repo-card-title">
                    <h3 class="start-card-title" id="repo-card-title">Fetch or Upload Repository File</h3>

                    <div class="start-form">
                        <div class="start-field">
                            <div class="start-field-label">Base file</div>
                            <div class="start-field-row start-field-row-repo">
                                <span class="start-field-prefix">From:</span>
                                <button type="button" class="start-toggle" id="repo-source-toggle" aria-pressed="false">
                                    Local
                                </button>
                                <div class="start-input-wrap">
                                    <input type="file" class="start-input" id="repo-source-input" aria-label="Base file" accept="application/json,.repo,.jrepo,.mccr,.mccrepo,.mrepo,.mRepo" />
                                </div>
                            </div>
                        </div>
                        <div class="start-actions">
                            <button type="button" class="start-primary" id="repo-fetch" disabled>
                                Fetch
                            </button>
                        </div>
                        <div class="start-error" id="repo-error" role="alert" aria-live="polite"></div>
                    </div>
                </div>

                <div class="start-card" role="region" aria-labelledby="folder-card-title">
                    <h3 class="start-card-title" id="folder-card-title">Open a local folder</h3>
                    <div class="start-form">
                        <div class="start-actions">
                            <button type="button" class="start-primary" id="folder-open" disabled>
                                Open folder
                            </button>
                        </div>
                        <div id="folder-base-row" class="start-field" style="display: none;">
                            <div class="start-field-row">
                                <span class="start-field-prefix">Base repo:</span>
                                <div class="start-input-wrap">
                                    <select class="start-input" id="folder-base-select" aria-label="Base repo file">
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="start-actions" id="folder-load-wrap" style="display: none;">
                            <button type="button" class="start-primary" id="folder-load">
                                Load
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="start-cards-row start-cards-row-single">
                <div class="start-card start-card-soon" role="region" aria-labelledby="api-card-title">
                    <h3 class="start-card-title" id="api-card-title">Connect to API</h3>

                    <div class="start-form">
                        <div class="start-field">
                            <label class="start-field-row start-field-row-api" for="api-address">
                                <span class="start-field-prefix">Adress:</span>
                                <div class="start-input-wrap">
                                    <input type="url" class="start-input" id="api-address" placeholder="https://example.com" />
                                </div>
                            </label>
                        </div>

                        <div class="start-actions">
                            <button type="button" class="start-primary" id="api-connect" disabled>
                                Connect
                            </button>
                        </div>
                    </div>

                    <div class="start-card-soon-overlay" aria-hidden="true">
                        <span class="start-card-soon-text">Comming soon</span>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
